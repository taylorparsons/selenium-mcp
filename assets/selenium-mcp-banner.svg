<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="900" viewBox="0 0 1600 900">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0A1119"/><stop offset="0.53" stop-color="#101B26"/><stop offset="1" stop-color="#0D1520"/></linearGradient>
 <radialGradient id="aura"><stop offset="0" stop-color="#E27D40" stop-opacity=".24"/><stop offset=".55" stop-color="#BC643B" stop-opacity=".07"/><stop offset="1" stop-color="#B8542B" stop-opacity="0"/></radialGradient>
 <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#3B4B58"/><stop offset=".55" stop-color="#1B2B37"/><stop offset="1" stop-color="#293B48"/></linearGradient>
 <linearGradient id="copper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFB66F"/><stop offset=".45" stop-color="#E98243"/><stop offset="1" stop-color="#BF5532"/></linearGradient>
 <linearGradient id="chipFill" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#1C2A34"/><stop offset="1" stop-color="#0F1B26"/></linearGradient>
 <filter id="shadow" x="-35%" y="-35%" width="170%" height="180%"><feGaussianBlur in="SourceAlpha" stdDeviation="20"/><feOffset dy="20"/><feComponentTransfer><feFuncA type="linear" slope=".30"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.5" fill="#7490A1" opacity=".12"/></pattern>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
